<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBS Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial;color:#fff}.practice{position:fixed;top:0;width:100%;z-index:9;text-align:center;background:#6b2020;padding:5px;font-size:11px;font-weight:bold}.app{max-width:430px;margin:auto;padding-top:25px;min-height:100vh;background:#171412}.top{height:65px;padding:20px}.hero{height:320px;padding:55px 25px;background:linear-gradient(135deg,#8b431d,#e3a31d,#362114)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:25px 12px}.i{text-align:center;font-size:13px}.ico{width:52px;height:52px;border:1px solid #aaa;border-radius:13px;margin:auto auto 8px;display:grid;place-items:center;font-size:24px}.login{padding:35px 25px;text-align:center;min-height:calc(100vh - 25px);background:linear-gradient(#333,#090909)}.avatar{margin:120px auto 12px;width:88px;height:88px;border-radius:50%;background:#ddd;color:#777;display:grid;place-items:center;font-size:40px}input{width:100%;padding:18px;margin:28px 0 8px;font-size:18px}.red{width:100%;padding:17px;margin-top:20px;border:0;background:#e6422d;color:#fff;font-size:18px}.welcome{padding:65px 25px 35px;background:linear-gradient(135deg,#e2a01d,#f0bc22)}.light{background:#f7f7f7;color:#222}.tabs{display:flex}.tabs b{width:50%;padding:20px;text-align:center;border-bottom:3px solid #d99c17}.account{padding:28px 22px}.bal{text-align:right;font-size:25px}.card{margin:12px 18px;padding:20px;background:white;color:#222;border-radius:8px}.activity{padding:22px;min-height:calc(100vh - 90px);background:#f5f5f5;color:#222}.action{width:100%;padding:17px;margin:8px 0;background:#fff;border:1px solid #ddd;text-align:left;font-size:16px}.check{font-size:70px;color:#2a5;text-align:center}</style>
<div class="practice">DBS PRACTICE • NO REAL MONEY</div><div id="a" class="app"></div><script>
const a=document.querySelector("#a"),BAL="₹15,56,431.49"; const items=[["＋","Add Money"],["▣","Pay Bills"],["⌗","Scan & Pay"],["⇄","Transfer"],["₹","Personal Loan"],["◎","Overseas Transfer"],["▤","digiPortfolio"],["⋮","More"]];
function landing(){a.innerHTML=`<div class=top><b>✦ digibank <small>by DBS</small></b></div><div class=hero><h1>Live more</h1><p>Make memories while your practice portfolio handles simulated investments.</p></div><div class=grid>${items.map(x=>`<div class=i onclick="login()"><div class=ico>${x[0]}</div>${x[1]}</div>`).join("")}</div><button class=red onclick=login()>LOGIN</button>`}
function login(){a.innerHTML=`<div class=login><b>✦ digibank <small>by DBS</small></b><div class=avatar>♙</div><div>Practice User</div><small>Training account — not connected to DBS</small><input type=password placeholder="Practice password"><div style="text-align:left">Trouble logging in?</div><button class=red onclick=home()>LOGIN</button></div>`}
function home(){a.innerHTML=`<div class=top>☰ <span style="float:right">♧　▢</span></div><div class=welcome><h1>Welcome to<br>digibank</h1><p>Enjoy a convenient way to practice banking on the go.</p></div><div class="grid light">${items.slice(0,4).map(x=>`<div class=i onclick="activity('${x[1]}')"><div class=ico>${x[0]}</div>${x[1]}</div>`).join("")}</div><div class="tabs light"><b>ACCOUNTS</b><b onclick="activity('Insights')">INSIGHTS</b></div><div class="account light"><h3>Account　›</h3><b>DIGISAVINGS</b><p>********45508 / UPI: practice@dbs</p><div class=bal>Balance<br><b>${BAL}</b></div></div><div class=card onclick="activity('UPI Linked Accounts')"><b>UPI Linked Accounts / Credit Cards</b><p>Practice linking accounts and cards.</p></div><div class=card onclick="activity('Deposits')"><b>Deposits　›</b></div>`}
function activity(n){let m=n=="More"?["Cards","Deposits","Loans","Settings","Help & Support"].map(x=>`<button class=action onclick="activity('${x}')">${x}　›</button>`).join(""):`<button class=action onclick="flow('${n}')">Start ${n} practice　›</button>`;a.innerHTML=`<div class=top onclick=home()>‹　<b>${n}</b></div><div class=activity><h2>${n}</h2><p>Simulated banking activity.</p>${m}<small>No real DBS/UPI service is contacted.</small></div>`}
function flow(n){a.innerHTML=`<div class=top onclick="activity('${n}')">‹　<b>${n}</b></div><div class=activity><h2>Enter practice amount</h2><input inputmode=decimal placeholder="₹0"><button class=red onclick="success('${n}')">CONTINUE</button><p>Balance remains fixed at ${BAL}.</p></div>`}
function success(n){a.innerHTML=`<div class=top onclick=home()>×　<b>${n}</b></div><div class=activity><div class=check>✓</div><h2 style="text-align:center">Practice completed</h2><p style="text-align:center">No real money was moved.</p><h2 style="text-align:center">${BAL}</h2><button class=red onclick=home()>DONE</button></div>`}landing();
</script>
