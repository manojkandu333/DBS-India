<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial;color:#fff}#a{max-width:430px;margin:auto;min-height:100vh;background:#181514}.top{padding:20px;height:64px}.hero{height:310px;padding:55px 24px;background:linear-gradient(135deg,#81401d,#dda01c,#382318)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:24px 12px}.it{text-align:center;font-size:12px}.ic{width:52px;height:52px;border:1px solid #aaa;border-radius:13px;margin:auto auto 8px;display:grid;place-items:center;font-size:23px}.login{padding:30px 24px;text-align:center;min-height:100vh;background:linear-gradient(#333,#080808)}.av{margin:120px auto 10px;width:86px;height:86px;border-radius:50%;background:#ddd;color:#777;display:grid;place-items:center;font-size:38px}input,textarea{width:100%;padding:17px;margin:10px 0;font-size:16px}.red{width:100%;padding:17px;background:#e5422d;color:white;border:0;font-size:17px;margin-top:16px}.welcome{padding:62px 24px 35px;background:linear-gradient(135deg,#df9b18,#f1bd21)}.light,.page{background:#f7f7f7;color:#222}.tabs{display:flex}.tabs div{width:50%;padding:19px;text-align:center;border-bottom:1px solid #ccc}.tabs div:first-child{border-bottom:3px solid #d99b16}.acct{padding:25px 22px}.bal{text-align:right;font-size:25px}.card,.choice{margin:10px 17px;padding:18px;background:#fff;color:#222;border:1px solid #ddd;border-radius:7px}.choice{display:block;width:calc(100% - 34px);text-align:left;font-size:16px}.page{min-height:calc(100vh - 64px);padding:18px 0}.page h2,.page p{padding:0 18px}.back{font-size:27px;margin-right:15px}.check{text-align:center;font-size:70px;color:#2a5}.scan{height:320px;margin:15px;background:#252525;color:white;display:grid;place-items:center;text-align:center}</style>
<div id=a></div><script>
const A=document.querySelector("#a"),BAL="₹15,56,431.49",UID="9985533631",I=[["＋","Add Money"],["▣","Pay Bills"],["⌗","Scan & Pay"],["⇄","Transfer"],["₹","Personal Loan"],["◎","Overseas Transfer"],["▤","digiPortfolio"],["⋮","More"]];
const top=(n,b="home()")=>`<div class=top><span class=back onclick="${b}">‹</span><b>${n}</b></div>`;
function landing(){A.innerHTML=`<div class=top><b>✦ digibank <small>by DBS</small></b></div><div class=hero><h1>Live more</h1><p>Make memories while your portfolio handles your investments.</p></div><div class=grid>${I.map(x=>`<div class=it onclick=login()><div class=ic>${x[0]}</div>${x[1]}</div>`).join("")}</div><button class=red onclick=login()>LOGIN</button>`}
function login(){A.innerHTML=`<div class=login><b>✦ digibank <small>by DBS</small></b><div class=av>♙</div><div>${UID}</div><input type=password placeholder="Password"><div style="text-align:left">Trouble logging in?</div><button class=red onclick=home()>LOGIN</button></div>`}
function home(){A.innerHTML=`<div class=top>☰<span style="float:right">♧　▢</span></div><div class=welcome><h1>Welcome to<br>digibank</h1><p>Enjoy the faster and more convenient way to bank on the go.</p></div><div class="grid light">${I.slice(0,4).map(x=>`<div class=it onclick="route('${x[1]}')"><div class=ic>${x[0]}</div>${x[1]}</div>`).join("")}</div><div class="tabs light"><div>ACCOUNTS</div><div onclick="generic('Insights')">INSIGHTS</div></div><div class="acct light"><h3>Account　›</h3><b>DIGISAVINGS</b><p>********45508</p><div class=bal>Balance<br><b>${BAL}</b></div></div><div class=card onclick="generic('UPI Linked Accounts')"><b>UPI Linked Accounts / Credit Cards</b>　›</div><div class=card onclick="generic('Deposits')"><b>Deposits</b>　›</div><div class=grid>${I.slice(4).map(x=>`<div class=it onclick="generic('${x[1]}')"><div class=ic>${x[0]}</div>${x[1]}</div>`).join("")}</div>`}
function route(n){n=="Transfer"?transfer():n=="Pay Bills"?bills():n=="Scan & Pay"?scan():n=="Add Money"?generic(n):generic(n)}
function transfer(){A.innerHTML=top("Transfer")+`<div class=page><h2>Transfer Money</h2><button class=choice onclick=benef()>To Bank Account / Beneficiary　›</button><button class=choice onclick="form('UPI Transfer')">To UPI ID　›</button><button class=choice onclick="form('Own Account Transfer')">To Own Account　›</button><button class=choice onclick="generic('Overseas Transfer')">Overseas Transfer　›</button></div>`}
function benef(){A.innerHTML=top("Beneficiaries","transfer()")+`<div class=page><h2>Select Beneficiary</h2><button class=choice onclick="form('Saved Beneficiary')">Saved Beneficiary ••••1024　›</button><button class=choice onclick=addBenef()>＋ Add New Beneficiary</button></div>`}
function addBenef(){A.innerHTML=top("Add Beneficiary","benef()")+`<div class=page><input placeholder="Beneficiary name"><input placeholder="Account number"><input placeholder="Re-enter account number"><input placeholder="IFSC code"><button class=red onclick="form('New Beneficiary')">CONTINUE</button></div>`}
function form(n){A.innerHTML=top(n,"transfer()")+`<div class=page><h2>Enter amount</h2><input inputmode=decimal placeholder="₹0"><textarea placeholder="Remarks (optional)"></textarea><button class=red onclick="review('${n}')">CONTINUE</button></div>`}
function review(n){A.innerHTML=top("Review")+`<div class=page><h2>Review</h2><div class=card><b>${n}</b><p>From: DIGISAVINGS ••••5508</p><p>Available balance: ${BAL}</p></div><button class=red onclick="success('${n}')">CONFIRM</button></div>`}
function success(n){A.innerHTML=top(n)+`<div class=page><div class=check>✓</div><h2 style="text-align:center">Successful</h2><p style="text-align:center">${n} completed</p><h2 style="text-align:center">${BAL}</h2><button class=red onclick=home()>DONE</button></div>`}
function bills(){A.innerHTML=top("Pay Bills")+`<div class=page><h2>Bill Payments</h2>${["Electricity","Mobile Postpaid","DTH","Broadband","Gas","Credit Card","Insurance","Water"].map(x=>`<button class=choice onclick="form('${x} Bill')">${x}　›</button>`).join("")}</div>`}
function scan(){A.innerHTML=top("Scan & Pay")+`<div class=page><div class=scan>⌜　　　　　⌝<br>Position QR inside frame<br>⌞　　　　　⌟</div><button class=choice onclick="form('QR Payment')">Enter payee manually　›</button></div>`}
function generic(n){let o=n=="More"?["Cards","Deposits","Loans","Profile & Settings","Help & Support"]:n=="Personal Loan"?["Check Eligibility","Loan Calculator","My Loans"]:n=="digiPortfolio"?["Mutual Funds","Investments","Portfolio Summary"]:n=="Deposits"?["Fixed Deposit","Recurring Deposit","View Deposits"]:["View Details","Explore Options","Service Requests"];A.innerHTML=top(n)+`<div class=page><h2>${n}</h2>${o.map(x=>`<button class=choice onclick="detail('${x}')">${x}　›</button>`).join("")}</div>`}
function detail(x){A.innerHTML=top(x)+`<div class=page><h2>${x}</h2><div class=card>Options and details for ${x}.</div><button class=red onclick=home()>DONE</button></div>`}landing();
</script>
