<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171313">
<title>DBS</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0e0e0e;font-family:Arial,sans-serif;color:#fff}
button,input,textarea{font:inherit} button{cursor:pointer}
#app{max-width:430px;margin:auto;min-height:100vh;background:#171313;overflow:hidden}
.top{height:62px;padding:19px 20px;background:#171313;font-weight:700}
.brand{font-size:23px}.brand small{font-size:13px;font-weight:500}
.hero{min-height:300px;padding:56px 25px;background:linear-gradient(135deg,#8e481d 0%,#e6a916 52%,#4b2b18 100%)}
.hero h1{font-size:43px;margin:70px 0 12px}.hero p{font-size:17px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 5px;padding:25px 12px}
.item{text-align:center;font-size:12px;line-height:1.25}.icon{width:54px;height:54px;border:1px solid #aaa;border-radius:14px;margin:0 auto 9px;display:grid;place-items:center;font-size:23px}
.primary{width:calc(100% - 32px);margin:17px 16px 26px;padding:17px;border:0;border-radius:3px;background:#e44331;color:white;font-size:17px}
.login{min-height:100vh;padding:28px 24px;text-align:center;background:linear-gradient(#383838,#090909)}
.avatar{width:86px;height:86px;border-radius:50%;margin:100px auto 13px;background:#ddd;color:#777;display:grid;place-items:center;font-size:38px}
.field{width:100%;padding:16px;margin:10px 0;border:1px solid #bbb;border-radius:4px;background:white;color:#222;font-size:16px}
.light,.page{background:#f5f5f5;color:#222}.welcome{padding:58px 24px 32px;background:linear-gradient(135deg,#db9315,#f0bf24)}
.welcome h1{font-size:34px;margin:0 0 12px}.tabs{display:flex;background:#fff}.tabs div{width:50%;padding:18px;text-align:center;border-bottom:1px solid #ddd}.tabs .active{border-bottom:3px solid #d79a16}
.account{padding:24px 21px;background:#fff;color:#222}.balance{text-align:right;font-size:24px}
.card,.choice{margin:10px 16px;padding:18px;background:#fff;color:#222;border:1px solid #ddd;border-radius:8px}
.choice{display:block;width:calc(100% - 32px);text-align:left;font-size:16px}
.page{min-height:calc(100vh - 62px);padding:15px 0 30px}.page h2,.page p{padding:0 18px}
.back{font-size:28px;margin-right:14px}.muted{color:#777;font-size:13px}.section{padding:8px 18px 0;font-size:13px;color:#777;font-weight:bold}
.scan{height:315px;margin:15px;background:#242424;color:#fff;display:grid;place-items:center;text-align:center;border-radius:9px;font-size:16px}
.scanbox{font-size:35px;line-height:2}.success{text-align:center;padding-top:55px}.tick{font-size:72px;color:#259b55}
.row{display:flex;justify-content:space-between;gap:12px}.pill{padding:8px 12px;border-radius:18px;background:#eee;font-size:12px}
.bottom{position:sticky;bottom:0;display:flex;background:#fff;color:#333;border-top:1px solid #ddd}.bottom div{flex:1;text-align:center;padding:12px 4px;font-size:11px}
.notice{margin:12px 16px;padding:10px 12px;border-radius:7px;background:#fff4d8;color:#6d5415;font-size:12px}
</style>
</head><body><div id="app"></div>
<script>
(function(){
"use strict";
var A=document.getElementById("app"), BAL="₹15,56,431.49", UID="9985533631";
function set(s){A.innerHTML=s;window.scrollTo(0,0);bind()}
function bind(){var n=document.querySelectorAll("[data-go]");for(var i=0;i<n.length;i++)n[i].onclick=function(){go(this.getAttribute("data-go"))}}
function top(t,b){return '<div class="top"><span class="back" data-go="'+(b||"home")+'">‹</span>'+t+'</div>'}
function tile(i,t,g){return '<div class="item" data-go="'+g+'"><div class="icon">'+i+'</div>'+t+'</div>'}
function choice(t,g,sub){return '<button class="choice" data-go="'+g+'"><b>'+t+'</b>'+(sub?'<br><span class="muted">'+sub+'</span>':'')+'<span style="float:right">›</span></button>'}
function landing(){set('<div class="top brand">✦ digibank <small>by DBS</small></div><div class="hero"><h1>Live more</h1><p>Simple everyday banking from your phone.</p></div><div class="grid">'+tile("＋","Add Money","login")+tile("▣","Pay Bills","login")+tile("⌗","Scan & Pay","login")+tile("⇄","Transfer","login")+tile("₹","Personal Loan","login")+tile("◎","Overseas Transfer","login")+tile("▤","digiPortfolio","login")+tile("⋮","More","login")+'</div><button class="primary" data-go="login">LOGIN</button>')}
function login(){set('<div class="login"><div class="brand">✦ digibank <small>by DBS</small></div><div class="avatar">♙</div><div>'+UID+'</div><input class="field" type="password" placeholder="Password" autocomplete="off"><div style="text-align:left;margin-top:8px">Trouble logging in?</div><button class="primary" style="width:100%;margin:22px 0" data-go="home">LOGIN</button></div>')}
function home(){set('<div class="top">☰ <span style="float:right">⌕　☻</span></div><div class="welcome"><h1>Welcome to<br>digibank</h1><p>Enjoy a convenient way to bank on the go.</p></div><div class="grid light">'+tile("＋","Add Money","addmoney")+tile("▣","Pay Bills","bills")+tile("⌗","Scan & Pay","scan")+tile("⇄","Transfer","transfer")+'</div><div class="tabs"><div class="active">ACCOUNTS</div><div data-go="insights">INSIGHTS</div></div><div class="account"><h3>Account <span style="float:right">›</span></h3><b>DIGISAVINGS</b><p class="muted">********45508</p><div class="balance"><span class="muted">Balance</span><br><b>'+BAL+'</b></div></div>'+choice("UPI Linked Accounts / Credit Cards","upi")+choice("Deposits","deposits")+'<div class="grid">'+tile("₹","Personal Loan","loan")+tile("◎","Overseas Transfer","overseas")+tile("▤","digiPortfolio","portfolio")+tile("⋮","More","more")+'</div><div class="bottom"><div data-go="home">⌂<br>Home</div><div data-go="transfer">⇄<br>Pay & Transfer</div><div data-go="more">⋮<br>More</div></div>')}
function transfer(){set(top("Transfer","home")+'<div class="page"><div class="section">TRANSFER MONEY</div>'+choice("To Bank Account / Beneficiary","beneficiaries","Saved or new beneficiary")+choice("To UPI ID","upiTransfer","Enter a UPI ID")+choice("To Own Account","own","Between your accounts")+choice("Overseas Transfer","overseas","International transfer")+'</div>')}
function beneficiaries(){set(top("Beneficiaries","transfer")+'<div class="page"><div class="section">SAVED BENEFICIARIES</div>'+choice("Saved Beneficiary","amount","Account ending 1024")+choice("＋ Add New Beneficiary","addbenef")+'</div>')}
function addbenef(){set(top("Add Beneficiary","beneficiaries")+'<div class="page" style="padding:18px"><input class="field" placeholder="Beneficiary name"><input class="field" inputmode="numeric" placeholder="Account number"><input class="field" inputmode="numeric" placeholder="Re-enter account number"><input class="field" placeholder="IFSC code"><button class="primary" style="width:100%;margin:16px 0" data-go="amount">CONTINUE</button></div>')}
function amount(){set(top("Enter Amount","transfer")+'<div class="page" style="padding:18px"><h2>How much?</h2><input class="field" inputmode="decimal" placeholder="₹0.00"><textarea class="field" placeholder="Remarks (optional)"></textarea><button class="primary" style="width:100%;margin:16px 0" data-go="review">CONTINUE</button></div>')}
function review(){set(top("Review","amount")+'<div class="page"><h2>Review transfer</h2><div class="card"><div class="row"><span>From</span><b>DIGISAVINGS ••••5508</b></div><hr><div class="row"><span>Available balance</span><b>'+BAL+'</b></div></div><div class="notice">This page is disconnected from real banking and does not send a payment.</div><button class="primary" data-go="success">CONFIRM</button></div>')}
function success(){set(top("Confirmation","home")+'<div class="page success"><div class="tick">✓</div><h2>Successful</h2><p>Demo request completed.</p><h2>'+BAL+'</h2><p class="muted">Displayed balance remains unchanged.</p><button class="primary" data-go="home">DONE</button></div>')}
function bills(){var x=["Electricity","Mobile Postpaid","DTH","Broadband","Gas","Credit Card","Insurance","Water"],s=top("Pay Bills","home")+'<div class="page"><div class="section">SELECT BILL CATEGORY</div>';for(var i=0;i<x.length;i++)s+=choice(x[i],"biller");set(s+'</div>')}
function biller(){set(top("Biller","bills")+'<div class="page" style="padding:18px"><input class="field" placeholder="Biller / provider"><input class="field" placeholder="Consumer / account number"><button class="primary" style="width:100%;margin:16px 0" data-go="billamount">CONTINUE</button></div>')}
function billamount(){set(top("Bill Details","biller")+'<div class="page" style="padding:18px"><input class="field" inputmode="decimal" placeholder="Amount"><button class="primary" style="width:100%;margin:16px 0" data-go="review">REVIEW</button></div>')}
function scan(){set(top("Scan & Pay","home")+'<div class="page"><div class="scan"><div class="scanbox">⌜　　　⌝<br>　QR　<br>⌞　　　⌟<div style="font-size:14px">Position QR inside frame</div></div></div>'+choice("Enter payee manually","upiTransfer","Use a demo UPI ID")+'</div>')}
function upiTransfer(){set(top("UPI Transfer","transfer")+'<div class="page" style="padding:18px"><input class="field" placeholder="UPI ID"><button class="primary" style="width:100%;margin:16px 0" data-go="amount">VERIFY & CONTINUE</button></div>')}
function own(){set(top("Own Account Transfer","transfer")+'<div class="page">'+choice("DIGISAVINGS ••••5508","amount","Available '+BAL)+choice("Select another account","amount")+'</div>')}
function addmoney(){set(top("Add Money","home")+'<div class="page"><h2>Add Money</h2>'+choice("From linked bank account","amount")+choice("Bank transfer details","details")+'</div>')}
function deposits(){set(top("Deposits","home")+'<div class="page"><h2>Deposits</h2>'+choice("Fixed Deposit","details")+choice("Recurring Deposit","details")+choice("View Deposits","details")+'</div>')}
function loan(){set(top("Personal Loan","home")+'<div class="page"><h2>Personal Loan</h2>'+choice("Check Eligibility","details")+choice("Loan Calculator","details")+choice("My Loans","details")+'</div>')}
function portfolio(){set(top("digiPortfolio","home")+'<div class="page"><h2>digiPortfolio</h2>'+choice("Mutual Funds","details")+choice("Investments","details")+choice("Portfolio Summary","details")+'</div>')}
function overseas(){set(top("Overseas Transfer","home")+'<div class="page"><h2>Overseas Transfer</h2>'+choice("Add overseas recipient","details")+choice("Saved recipients","details")+choice("Transfer status","details")+'</div>')}
function more(){set(top("More","home")+'<div class="page"><h2>More</h2>'+choice("Cards","details")+choice("Deposits","deposits")+choice("Loans","loan")+choice("Profile & Settings","settings")+choice("Help & Support","help")+'</div>')}
function settings(){set(top("Profile & Settings","more")+'<div class="page">'+choice("Personal Details","details")+choice("Security Settings","details")+choice("Manage Devices","details")+choice("Notifications","details")+'</div>')}
function help(){set(top("Help & Support","more")+'<div class="page">'+choice("FAQs","details")+choice("Contact Options","details")+choice("Service Requests","details")+'</div>')}
function details(){set(top("Details","home")+'<div class="page"><h2>Details</h2><div class="card">This section is available for navigation in the demo.</div><button class="primary" data-go="home">DONE</button></div>')}
function insights(){set(top("Insights","home")+'<div class="page"><h2>Insights</h2><div class="card"><b>Account overview</b><p class="muted">Demo spending and savings insights would appear here.</p></div></div>')}
function upi(){set(top("UPI Linked Accounts","home")+'<div class="page"><h2>Linked Accounts</h2><div class="card"><b>DIGISAVINGS ••••5508</b><p class="muted">Primary account</p></div>'+choice("Manage UPI settings","details")+'</div>')}
function go(n){var r={landing:landing,login:login,home:home,transfer:transfer,beneficiaries:beneficiaries,addbenef:addbenef,amount:amount,review:review,success:success,bills:bills,biller:biller,billamount:billamount,scan:scan,upiTransfer:upiTransfer,own:own,addmoney:addmoney,deposits:deposits,loan:loan,portfolio:portfolio,overseas:overseas,more:more,settings:settings,help:help,details:details,insights:insights,upi:upi};(r[n]||home)()}
landing();
})();
</script></body></html>
